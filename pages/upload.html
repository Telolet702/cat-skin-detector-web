<div class="topbar">
  <button class="icon-btn" onclick="go('page-home')" aria-label="Kembali"><i class="ti ti-arrow-left" aria-hidden="true"></i></button>
  <div class="topbar-title">Unggah Foto</div>
  <div style="width:40px"></div>
</div>
<div style="flex:1; padding:20px; display:flex; flex-direction:column;">
  <p style="font-size:14px; color:var(--color-text-secondary); margin-bottom:16px;">Pilih foto area kulit kucing yang dicurigai terinfeksi untuk dianalisis oleh AI.</p>
  <div class="upload-zone" id="upload-zone" onclick="triggerUpload()">
    <i class="ti ti-cloud-upload" style="font-size:36px; color:var(--color-text-secondary); margin-bottom:8px" aria-hidden="true"></i>
    <p style="font-size:14px; color:var(--color-text-secondary); margin-bottom:4px">Ketuk untuk memilih gambar</p>
    <p style="font-size:12px; color:var(--color-text-secondary)">dari galeri perangkat</p>
  </div>
  <input type="file" id="file-input" accept="image/*" style="display:none" onchange="handleFile(event)">
  <img id="upload-preview-img" style="display:none">
  <button class="btn" id="btn-detect-upload" style="display:none; margin-top:auto" onclick="detectUploadedImage()">Deteksi Sekarang</button>
</div>
