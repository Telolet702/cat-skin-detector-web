<div class="topbar">
  <button class="icon-btn" onclick="stopCameraAndGoHome()" aria-label="Kembali"><i class="ti ti-arrow-left" aria-hidden="true"></i></button>
  <div class="topbar-title">Deteksi Langsung</div>
  <div style="width:40px"></div>
</div>
<div style="flex:1; display:flex; flex-direction:column; background:#000; position:relative;">
  <div class="camera-view" id="camera-container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>
  <div class="camera-bottom">
    <div class="camera-status" id="camera-status">Memuat model AI...</div>
    <div class="camera-controls" style="justify-content: center; gap: 40px;">
      <button class="cam-btn capture-btn" id="btn-capture" aria-label="Ambil foto"><i class="ti ti-camera" aria-hidden="true"></i></button>
      <button class="cam-btn" onclick="flipCamera()" aria-label="Flip kamera"><i class="ti ti-camera-rotate" aria-hidden="true"></i></button>
    </div>
  </div>
</div>
